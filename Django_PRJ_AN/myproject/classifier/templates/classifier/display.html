<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ML Displayer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #ecfdf5;
            border-left: 5px solid #10b981;
            border-radius: 6px;
        }

        .error {
            margin-top: 30px;
            padding: 20px;
            background: #fef2f2;
            border-left: 5px solid #ef4444;
        }

        .confidence {
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Prediction History</h1>

    <p>_</p>
    <p>_</p>

    <!-- Display Box -->
    <table>
        <tr>
            <th>ID</th>
            <th>Text</th>
            <th>Prediction</th>
            <th>Confidence</th>
        </tr>

        <!-- {% for entry in db %}
        <tr>
            <td>{{ entry.i }}</td>
            <td>{{ entry.u }}</td>
            <td>{{ entry.p }}</td>
            <td>{{ entry.c }}</td>
        </tr>
        {% endfor %}  -->
    </table>

    <p>_</p>

    <a href="{% url 'classify' %}">
        Prediction Classifier
    </a>

</div>

</body>
</html>
